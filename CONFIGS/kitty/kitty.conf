background #0f0f0f
foreground #c5c5c5
color0 #1c1c1c
color8 #3d3d3d
color1 #8b5a5a
color9 #a86b6b
color2 #5a8b5a
color10 #6ba86b
color3 #8b8b5a
color11 #a8a86b
color4 #5a5a8b
color12 #6b6ba8
color5 #8b5a8b
color13 #a86ba8
color6 #5a8b8b
color14 #6ba8a8
color7 #8f8f8f
color15 #d0d0d0
selection_background #2e2e2e
selection_foreground #dcdcdc
cursor #dcdcdc

hide_window_decorations yes
window_padding_width 6
window_padding_height 6
dynamic_padding yes
remember_window_size yes
initial_window_width 800
initial_window_height 600

cursor_shape block
cursor_blink_interval 0.5
cursor_stop_blinking_after 15.0

font_family JetBrainsMono NF
bold_font JetBrainsMono NF
italic_font JetBrainsMono NF
bold_italic_font JetBrainsMono NF
font_size 12.0
adjust_line_height 0
adjust_column_width 0

scrollback_lines 10000
scrollback_pager less +G -R
wheel_scroll_multiplier 5.0
touch_scroll_multiplier 1.0

mouse_hide_wait 2.0
copy_on_select yes
strip_trailing_spaces never
visual_bell_duration 0.0
enable_audio_bell no
click_interval 0.5
focus_follows_mouse no

detect_urls yes
open_url_modifiers ctrl+shift
open_url_with default

background_opacity 0.96
dynamic_background_opacity yes
background_tint 0.0

dim_opacity 0.65

mouse_map none
allow_remote_control yes
listen_on none
watch_config_file yes
update_check_interval 0

shell_integration enabled
shell_integration_font_size 12.0

tab_bar_style hidden

wayland_titlebar_color system
linux_display_server auto

sync_to_monitor yes
repaint_delay 10
input_delay 3

dpi_aware yes
resize_draw_strategy static
window_resize_step 2
