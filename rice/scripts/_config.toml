[brightness]
title = "Brightness"
geometry = "420x140"
min_percent = 0
max_percent = 100
step = 5
backlight_dir = "/sys/class/backlight"

[volume]
title = "Volume"
geometry = "420x140"
min_percent = 0
max_percent = 150
default_control = "Master"

[screenshot]
default_mode = "area"
delay = 0

[notifier]
max_notifications = 5
timeout = 5000
position = "top-right"
margin = 10
padding = 10
width = 350
font_family = "Arial"
font_size = 12
bg_color = "#2e3440"
fg_color = "#d8dee9"
border_color = "#4c566a"
border_width = 1
corner_radius = 8
close_on_click = true
separator = true

[launcher]
title = "Launcher"
geometry = "650x500"
topmost = true
stay_open = false
result_limit = 50
font_family = "Arial"
font_size = 14
list_font_size = 12
bg_color = "#2e3440"
fg_color = "#d8dee9"
entry_bg = "#3b4252"
entry_fg = "#eceff4"
list_bg = "#2e3440"
list_fg = "#d8dee9"
list_select_bg = "#4c566a"
list_select_fg = "#eceff4"
padding = 10
cache_dir = "~/.cache/launcher"
cache_ttl = 86400
force_refresh = true
locale = ""
desktop_dirs = ["/usr/share/applications", "/usr/local/share/applications", "~/.local/share/applications"]
